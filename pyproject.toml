[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imon"
version = "1.0.0"
description = "Internet connection and webpage availability monitor CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0"
]

[project.scripts]
imon = "imon.cli:main"
